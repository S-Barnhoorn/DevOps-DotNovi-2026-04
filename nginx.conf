upstream dotnovi {
    zone dotnovi 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app:3000 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://dotnovi;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        add_header X-Backend $upstream_addr always;
    }
}