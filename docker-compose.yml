services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.multistage
    environment:
      DATABASE_URL: postgresql://dotnovi:${DB_PASSWORD}@postgres:5432/dotnovi
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dotnovi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dotnovi
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dotnovi -d dotnovi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: